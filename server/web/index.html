<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Memory Clip</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <span class="dot"></span>
      <span>Memory Clip</span>
    </a>
    <span class="sub" id="topSub"></span>
    <button class="dev-pill" id="devPill" hidden></button>
    <span class="bat-pill" id="batPill" hidden></span>
  </header>

  <!-- กดป้ายสถานะ -> รายละเอียดกล้อง -->
  <div class="dev-panel" id="devPanel" hidden></div>

  <main id="app"></main>

  <!-- แถบล่างตอนเลือกภาพ: ยกเลิก / ลบ (อยู่ล่างจอตลอด ไม่ต้องเลื่อนกลับขึ้นไปหาปุ่ม) -->
  <div class="pick-bar" id="pickBar" hidden>
    <button class="cancel">Cancel</button>
    <button class="del">Delete <span class="n">0</span></button>
  </div>

  <!-- แจ้งหลังลบ + ปุ่มเลิกทำ -->
  <div class="toast" id="toast" hidden><span></span><button>Undo</button></div>

  <!-- ดูภาพเต็มจอ -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav prev" aria-label="Previous photo">&#8249;</button>
    <img alt="">
    <button class="lb-nav next" aria-label="Next photo">&#8250;</button>
    <div class="lb-cap"></div>
    <button class="lb-share">Share</button>
    <button class="lb-del" aria-label="Delete this photo">Delete</button>
  </div>

  <!-- โค้ดหน้าเว็บแยกเป็นหลายไฟล์ใน js/ (type="module" ให้ไฟล์ import กันเองได้) ดูรายชื่อไฟล์ใน js/main.js -->
  <script type="module" src="/web/js/main.js"></script>
</body>
</html>
