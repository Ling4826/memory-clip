<!doctype html><html lang="th"><meta charset="utf-8"><title>ภาพตรวจโมเดลภายในเครื่อง</title><style>body{margin:0;background:#f3f4ef}canvas{display:block}p{position:absolute;top:12px;left:24px;font:16px Tahoma;color:#294b48}</style><p>ภาพตรวจรูปทรง · ไม่ใช่หน้าใช้งานจริง</p><script src="config.js"></script><script type="module">
import * as THREE from './vendor/three.module.js';import {makeShell} from './shell-geometry.js';
const {buildDevice}=new Function('THREE','CONFIG','makeShell',await(await fetch('model.js')).text()+'\nreturn {buildDevice};')(THREE,window.CONFIG,makeShell);
const state={version:'v2',variant:'clip',battery:1200,angle:10,fov:false},scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,2000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#f3f4ef');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight('#ffffff','#75847c',2.6));const light=new THREE.DirectionalLight('#fff8ed',3.1);light.position.set(90,180,160);scene.add(light);const fill=new THREE.DirectionalLight('#bce3e4',1.9);fill.position.set(-150,40,-100);scene.add(fill);

rebuild();window.__viewer={state,renderer,rebuild,get device(){return device;}};window.__viewerReady=true;
